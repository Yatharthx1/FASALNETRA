# Render Blueprint: New > Blueprint > this repo/branch. Secrets marked sync: false are asked for in the dashboard.
services:
  - type: web
    name: fasalnetra
    runtime: docker
    region: singapore          # closest Render region to India
    plan: starter              # paid plan: needed for the persistent disk below
    healthCheckPath: /api/v1/health
    disk:
      name: fasalnetra-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////var/data/fasalnetra.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: PUBLIC_BASE_URL     # https://<service>.onrender.com, no trailing slash
        sync: false
      - key: DEMO_FARMER_PHONE   # +91XXXXXXXXXX, the demo phone
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: VISION_PROVIDER     # same value as your local .env
        sync: false
      - key: SMS_LINK_SIGNING_SECRET
        generateValue: true
